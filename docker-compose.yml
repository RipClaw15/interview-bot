services:
  backend:
    build:
      context: ./backend
    image: interview-bot-backend
    env_file:
      - ./backend/.env
    environment:
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      INTERVIEW_DATA_DIR: /app/data/interviews
    ports:
      - "8000:8000"
    volumes:
      - interview_data:/app/data/interviews
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    image: interview-bot-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  interview_data: